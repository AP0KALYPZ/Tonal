[package]
name = "tonal"
version = "1.0.0"
description = "TONAL — Graphite Reference Studio"
authors = ["TONAL"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tonal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
png = "0.17"
base64 = "0.22"
sha2 = "0.10"
flate2 = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
